  <script type="module">
    const body = document.body;
    const burger = document.querySelector('.t3-burger');
    const menuLinks = document.querySelectorAll('.t3-menu__item');
    const sectionNames = new Set(['op', 'pickup']);

    const setActiveSection = (name) => {
      if (!sectionNames.has(name)) return;
      for (const className of Array.from(body.classList)) {
        if (className.startsWith('is-top3-')) body.classList.remove(className);
      }
      body.classList.add(`is-top3-${name}`);
    };

    burger?.addEventListener('click', () => {
      const open = body.classList.toggle('t3-menu-open');
      burger.setAttribute('aria-expanded', String(open));
    });

    menuLinks.forEach((link) => {
      link.addEventListener('click', () => {
        body.classList.remove('t3-menu-open');
        burger?.setAttribute('aria-expanded', 'false');
      });
    });

    const decodeText = (value) => {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = value;
      return textarea.value;
    };

    const pickupCopy = {
      'cast2/momo/': {
        name: '&#12418;&#12418;',
        role: '&#21103;&#24215;&#38263;&#32;&#47;&#32;&#36939;&#21942;&#37096;',
        text: '&#33853;&#12385;&#30528;&#12356;&#12383;&#31354;&#27671;&#12391;&#22580;&#12434;&#25972;&#12360;&#12427;&#12289;&#12354;&#12395;&#12354;&#12417;&#12418;&#12426;&#12354;&#12398;&#21103;&#24215;&#38263;&#12290;'
      },
      'cast2/nagi/': {
        name: '&#20970;',
        role: '&#39164;&#32946;&#21306;&#30011;&#32;&#47;&#32;&#29356;',
        text: '&#21427;&#12375;&#12356;&#35347;&#32244;&#12434;&#36234;&#12360;&#12390;&#12365;&#12383;&#12289;&#38972;&#12428;&#12427;&#29356;&#12398;&#12461;&#12515;&#12473;&#12488;&#12290;'
      },
      'cast2/philia/': {
        name: '&#12501;&#12451;&#12522;&#12450;',
        role: '&#39164;&#32946;&#21306;&#30011;&#32;&#47;&#32;&#12459;&#12540;&#12496;&#12531;&#12463;&#12523;',
        text: '&#24681;&#12434;&#36820;&#12377;&#26053;&#12398;&#36884;&#20013;&#12391;&#24215;&#12395;&#31435;&#12388;&#12289;&#23453;&#30707;&#12434;&#25345;&#12388;&#12459;&#12540;&#12496;&#12531;&#12463;&#12523;&#12290;'
      }
    };

    const pickupRoot = document.querySelector('[data-pickup-root]');
    const pickupCards = document.querySelectorAll('.t3-pickup-card');
    const previewName = document.querySelector('[data-pickup-preview-name]');
    const previewRole = document.querySelector('[data-pickup-preview-role]');
    const previewText = document.querySelector('[data-pickup-preview-text]');
    const previewLink = document.querySelector('[data-pickup-preview-link]');

    const setPickupCard = (card) => {
      const href = card.getAttribute('href');
      const copy = pickupCopy[href];
      if (!copy) return;
      pickupCards.forEach((item) => {
        const selected = item === card;
        item.classList.toggle('is-selected', selected);
        item.setAttribute('aria-pressed', String(selected));
      });
      pickupRoot?.classList.add('has-pickup-selection');
      if (previewName) previewName.textContent = decodeText(copy.name);
      if (previewRole) previewRole.textContent = decodeText(copy.role);
      if (previewText) previewText.textContent = decodeText(copy.text);
      if (previewLink) previewLink.setAttribute('href', href);
    };

    pickupCards.forEach((card, index) => {
      card.setAttribute('aria-controls', 'top3-pickup-preview');
      card.setAttribute('aria-pressed', 'false');
      card.addEventListener('click', (event) => {
        event.preventDefault();
        setPickupCard(card);
      });
    });

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setActiveSection(entry.target.dataset.top3Section);
        });
      }, { rootMargin: '-52% 0px -42% 0px', threshold: 0 });

      document.querySelectorAll('[data-top3-section]').forEach((section) => observer.observe(section));
    }
  </script>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>あにあめもりあ Top3</title>
  <meta name="description" content="あにあめもりあのトップ演出確認ページです。">
  <link rel="stylesheet" href="css3/top3.css">
</head>
<body class="t3 is-top3-op">
  <header class="t3-header" aria-label="サイトナビゲーション">
    <a class="t3-brand" href="index3.html" aria-label="あにあめもりあ Top3">
      <img class="t3-brand__logo" src="assets/top3/logo.webp" alt="あにあめもりあ">
    </a>
    <nav class="t3-nav" aria-label="メインメニュー">
      <a class="t3-nav__item" href="news2/">ニュース</a>
      <a class="t3-nav__item" href="cast2/">キャスト紹介</a>
      <a class="t3-nav__item" href="gallery2/">ギャラリー</a>
      <a class="t3-nav__item" href="partner2/">提携イベント</a>
      <a class="t3-nav__item" href="links2/">関連リンク</a>
      <a class="t3-nav__item" href="aikotoba2/">合言葉</a>
    </nav>
    <button class="t3-burger" type="button" aria-label="メニューを開く" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="t3-menu" aria-label="モバイルメニュー">
    <a class="t3-menu__item" href="news2/">ニュース</a>
    <a class="t3-menu__item" href="cast2/">キャスト紹介</a>
    <a class="t3-menu__item" href="gallery2/">ギャラリー</a>
    <a class="t3-menu__item" href="partner2/">提携イベント</a>
    <a class="t3-menu__item" href="links2/">関連リンク</a>
    <a class="t3-menu__item" href="aikotoba2/">合言葉</a>
  </nav>

  <main class="t3-main">
    <h1 class="t3-sr">あにあめもりあ Top3</h1>

    <div class="t3-handoff" aria-hidden="true">
      <div class="t3-handoff__fixed t3-handoff__fixed--dark">
        <div class="t3-handoff__fixed-inner t3-handoff__fixed-inner--dark"></div>
      </div>
      <div class="t3-handoff__fixed t3-handoff__fixed--light">
        <div class="t3-handoff__fixed-inner t3-handoff__fixed-inner--light"></div>
      </div>
    </div>

    <section id="top3-op" class="t3-op" data-top3-section="op" aria-label="オープニング">
      <div class="t3-op__loading" aria-hidden="true">
        <div class="t3-op__loading-frame">
          <img class="t3-op__loading-logo" src="assets/top3/logo.webp" alt="">
          <div class="t3-op__loading-word" aria-label="LOADING">
            <span>L</span><span>O</span><span>A</span><span>D</span><span>I</span><span>N</span><span>G</span>
          </div>
          <span class="t3-op__loading-rule"></span>
        </div>
      </div>

      <div class="t3-op__kv" aria-hidden="true">
        <div class="t3-op__stage">
          <img class="t3-op__bg" src="assets/top3/bg-bar.webp" alt="">

          <picture class="t3-op__ground">
            <source media="(max-width: 600px)" srcset="assets/top3/op/chara-ground-shadow-mobile.webp">
            <source media="(max-width: 900px)" srcset="assets/top3/op/chara-ground-shadow-tablet.webp">
            <img class="t3-op__ground-img" src="assets/top3/op/chara-ground-shadow-desktop.webp" alt="">
          </picture>

          <div class="t3-op__characters">
            <div class="t3-op__chara-slot t3-op__chara-slot--left">
              <picture>
                <source media="(max-width: 600px)" srcset="assets/top3/op/chara-ten-mobile-stage-distance.webp">
                <source media="(max-width: 900px)" srcset="assets/top3/op/chara-ten-tablet-stage-distance.webp">
                <img class="t3-op__chara" src="assets/top3/chara-right.webp" alt="">
              </picture>
            </div>
            <div class="t3-op__chara-slot t3-op__chara-slot--right">
              <picture>
                <source media="(max-width: 600px)" srcset="assets/top3/op/chara-momo-mobile-stage-distance.webp">
                <source media="(max-width: 900px)" srcset="assets/top3/op/chara-momo-tablet-stage-distance.webp">
                <img class="t3-op__chara" src="assets/top3/chara-left.webp" alt="">
              </picture>
            </div>
          </div>

          <div class="t3-op__sakura">
            <div class="t3-op__sakura-stream t3-op__sakura-stream--left">
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-light-1.webp" alt=""></span>
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-light-1.webp" alt=""></span>
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-light-1.webp" alt=""></span>
            </div>
            <div class="t3-op__sakura-stream t3-op__sakura-stream--center">
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-light-2.webp" alt=""></span>
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-light-2.webp" alt=""></span>
            </div>
            <div class="t3-op__sakura-stream t3-op__sakura-stream--right">
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-dark-1.webp" alt=""></span>
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-dark-1.webp" alt=""></span>
              <span class="t3-op__petal"><img src="assets/top3/op/sakura-dark-1.webp" alt=""></span>
            </div>
          </div>

          <div class="t3-op__decor">
            <span class="t3-op__deco t3-op__deco--right-large"><img src="assets/top3/op/kv-deco-right-1.webp" alt=""></span>
            <span class="t3-op__deco t3-op__deco--right-small"><img src="assets/top3/op/kv-deco-right-2.webp" alt=""></span>
            <span class="t3-op__deco t3-op__deco--left-large"><img src="assets/top3/op/kv-deco-left-1.webp" alt=""></span>
            <span class="t3-op__deco t3-op__deco--left-small"><img src="assets/top3/op/kv-deco-left-2.webp" alt=""></span>
          </div>

          <div class="t3-op__logo-wrap">
            <img class="t3-op__logo" src="assets/top3/logo.webp" alt="">
          </div>
        </div>
      </div>

      <div class="t3-op__intro" aria-hidden="true">
        <div class="t3-op__transition">
          <div class="t3-op__transition-panels"></div>
          <span class="t3-op__transition-seam"></span>
        </div>
      </div>

    </section>

    <section id="top3-pickup" class="t3-pickup" data-top3-section="pickup" aria-labelledby="top3-pickup-title">
      <div class="t3-pickup-reset" data-pickup-root>
        <h2 id="top3-pickup-title" class="t3-pickup-reset__sr">Pickup Cast キャスト案内</h2>
      </div>
    </section>
  </main>

  <script type="module">
    const body = document.body;
    const burger = document.querySelector('.t3-burger');
    const menuLinks = document.querySelectorAll('.t3-menu__item');
    const sectionNames = new Set(['op', 'pickup']);

    const setActiveSection = (name) => {
      if (!sectionNames.has(name)) return;
      for (const className of Array.from(body.classList)) {
        if (className.startsWith('is-top3-')) body.classList.remove(className);
      }
      body.classList.add(`is-top3-${name}`);
    };

    burger?.addEventListener('click', () => {
      const open = body.classList.toggle('t3-menu-open');
      burger.setAttribute('aria-expanded', String(open));
    });

    menuLinks.forEach((link) => {
      link.addEventListener('click', () => {
        body.classList.remove('t3-menu-open');
        burger?.setAttribute('aria-expanded', 'false');
      });
    });

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setActiveSection(entry.target.dataset.top3Section);
        });
      }, { rootMargin: '-52% 0px -42% 0px', threshold: 0 });

      document.querySelectorAll('[data-top3-section]').forEach((section) => observer.observe(section));
    }
  </script>
</body>
</html>
